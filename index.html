<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nitesh Design | Premium Interior Design</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #0f1419;
      --secondary: #1a1f3a;
      --accent: #e8d4a8;
      --accent-dark: #d4af6a;
      --accent-light: #f5e6d3;
      --light: #f5f5f5;
      --text-dark: #2c2c2c;
      --text-light: #ffffff;
      --border-color: rgba(232, 212, 168, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="6" fill="%23e8d4a8"/></svg>') 16 16, auto;
    }

    a, button {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><g><rect x="7" y="1" width="8" height="6" fill="%23e8d4a8" rx="0.5"/><rect x="10" y="6" width="2" height="14" fill="%23e8d4a8"/><circle cx="11" cy="20" r="2" fill="%23e8d4a8"/></g></svg>') 16 16, pointer;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      overflow-x: hidden;
      position: relative;
      font-family: 'Poppins', sans-serif;
    }

    /* Animated background with gradient mesh */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 50%, rgba(212, 175, 106, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(212, 175, 106, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(212, 175, 106, 0.04) 0%, transparent 50%);
      animation: bgFloat 20s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes bgFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -20px) scale(1.05); }
    }

    /* floating particles effect - furniture tools */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      font-size: 28px;
      animation: float linear infinite;
      opacity: 0.08;
      filter: drop-shadow(0 0 6px rgba(212, 175, 106, 0.2));
    }

    @keyframes float {
      0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.08;
      }
      90% {
        opacity: 0.08;
      }
      100% {
        transform: translateY(-100vh) translateX(100px) rotate(360deg);
        opacity: 0;
      }
    }

    /* Header/Logo */
    .logo-section {
      position: absolute;
      top: 40px;
      left: 40px;
      z-index: 20;
      animation: fadeInDown 0.8s ease;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: transparent;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: none;
      transition: all 0.3s ease;
      border: none;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .logo:hover .logo-icon {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 15px 40px rgba(232, 212, 168, 0.45);
      background: linear-gradient(135deg, var(--accent-light) 0%, var(--accent) 100%);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .logo-text h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-light);
    }

    .logo-text span {
      font-size: 11px;
      color: var(--accent-light);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(232, 212, 168, 0.2);
    }

    /* Main Card */
    .card {
      position: relative;
      width: 100%;
      max-width: 540px;
      padding: 60px 50px;
      border-radius: 20px;
      background: rgba(22, 33, 62, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.08);
      z-index: 10;
      animation: slideUp 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s backwards;
      margin-top: 60px;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .header {
      text-align: center;
      margin-bottom: 45px;
      animation: fadeIn 0.8s ease 0.3s both;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 300;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
    }

    .divider {
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--accent-light), var(--accent), transparent);
      margin: 0 auto;
      border-radius: 2px;
      animation: expandWidth 0.8s ease 0.5s both;
      box-shadow: 0 0 15px rgba(232, 212, 168, 0.4);
    }

    @keyframes expandWidth {
      from {
        width: 0;
        opacity: 0;
      }
      to {
        width: 100px;
        opacity: 1;
      }
    }

    .subtitle {
      font-size: 12px;
      color: var(--accent-light);
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 15px;
      animation: fadeIn 0.8s ease 0.6s both;
      text-shadow: 0 2px 6px rgba(232, 212, 168, 0.25);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: fadeIn 0.8s ease 0.4s both;
    }

    .links a {
      text-decoration: none;
      color: var(--text-light);
      padding: 18px 24px;
      border-radius: 12px;
      border: 2px solid rgba(232, 212, 168, 0.4);
      background: rgba(232, 212, 168, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
      font-weight: 500;
      font-size: 15px;
    }

    .links a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(212, 175, 106, 0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    .links a:hover::before {
      transform: translateX(100%);
    }

    .links a span {
      font-size: 12px;
      color: var(--accent-light);
      font-weight: 600;
      transition: all 0.4s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 3px rgba(232, 212, 168, 0.2);
    }

    .links a:hover {
      transform: translateY(-6px);
      background: rgba(232, 212, 168, 0.12);
      border-color: var(--accent-light);
      box-shadow: 0 15px 40px rgba(232, 212, 168, 0.25);
      border-width: 2px;
    }

    .links a:hover span {
      transform: translateX(4px);
    }

    .support {
      margin-top: 35px;
      display: flex;
      gap: 14px;
      animation: fadeIn 0.8s ease 0.5s both;
    }

    .support a {
      flex: 1;
      text-align: center;
      padding: 16px 0;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      border: 2.5px solid var(--accent-light);
      background: rgba(232, 212, 168, 0.08);
      color: var(--accent-light);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
      overflow: hidden;
      font-size: 14px;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 4px rgba(232, 212, 168, 0.15);
    }

    .support a::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      transform: scaleY(0);
      transform-origin: center;
      transition: transform 0.5s ease;
      z-index: -1;
    }

    .support a:hover::before {
      transform: scaleY(1);
    }

    .support a:hover {
      color: var(--primary);
      transform: translateY(-5px);
      box-shadow: 0 20px 50px rgba(232, 212, 168, 0.4);
      border-color: var(--accent);
    }

    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      animation: fadeIn 0.8s ease 0.6s both;
      letter-spacing: 0.5px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Card hover glow */
    .card:hover {
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4),
                  inset 0 1px 0 rgba(255, 255, 255, 0.08),
                  0 0 40px rgba(212, 175, 106, 0.12);
    }

    @media(max-width: 768px) {
      .logo-section {
        top: 30px;
        left: 30px;
      }

      .logo-icon {
        width: 40px;
        height: 40px;
        font-size: 20px;
      }

      .logo-text h2 {
        font-size: 18px;
      }
    }

    @media(max-width: 480px) {
      .card {
        padding: 45px 30px;
        max-width: 90%;
        margin-top: 80px;
      }

      .header h1 {
        font-size: 32px;
      }

      .logo-section {
        top: 20px;
        left: 20px;
      }

      .support {
        flex-direction: column;
      }

      .support a {
        padding: 14px 0;
      }
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>

  <div class="logo-section">
    <a href="#" class="logo">
      <div class="logo-icon"><img src="logo.svg" alt="Nitesh Design Logo"></div>
      <div class="logo-text">
        <h2>Nitesh Design</h2>
        <span>Interior Studio</span>
      </div>
    </a>
  </div>

  <div class="card">
    <div class="header">
      <h1>Nitesh Kumar</h1>
      <p>Premium Interior Design & 3D Visualization</p>
      <div class="divider"></div>
      <div class="subtitle">Transforming Spaces Into Stories</div>
    </div>

    <div class="links">
      <a href="http://127.0.0.1:5500/Interia-main/index.html" target="_blank">
        Official Website
        <span>Visit</span>
      </a>
      <a href="https://www.instagram.com/dreaminterior.co.in/" target="_blank">
        Instagram
        <span>Follow</span>
      </a>
      <a href="https://https://www.youtube.com/@DreamInterior.i" target="_blank">
        YouTube
        <span>Watch</span>
      </a>
      <a href="https://niteshkumar848.github.io/niteshcv/#services" target="_blank">
        Portfolio
        <span>Explore</span>
      </a>
    </div>

    <div class="support">
      <a href="https://wa.me/917752828902" target="_blank">WhatsApp</a>
      <a href="tel:+917752828902">Call Now</a>
    </div>

    <footer>
      © 2026 • Nitesh Design • Premium Interior Design Studio
    </footer>
  </div>

  <script>
    // Furniture and design tools symbols
    const furnitureSymbols = [
      '🪑', '🛋️', '🛏️', '🚪', '🪟', '💡', '🏠', '📐',
      '🔨', '🎨', '📏', '✏️', '🛁', '🧵', '🖼️', '🌿',
      '🪴', '🕯️', '🔧', '📝',
    ];

    // Create floating furniture particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      const particleCount = 35;

      for (let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        
        const symbol = furnitureSymbols[Math.floor(Math.random() * furnitureSymbols.length)];
        particle.textContent = symbol;
        
        const startX = Math.random() * window.innerWidth;
        const startY = window.innerHeight + 10;
        const duration = 8 + Math.random() * 6;
        const delay = Math.random() * 4;

        particle.style.left = startX + 'px';
        particle.style.top = startY + 'px';
        particle.style.animation = `float ${duration}s linear ${delay}s infinite`;

        particlesContainer.appendChild(particle);
      }
    }

    document.addEventListener('DOMContentLoaded', createParticles);

    // Add ripple effect on button click
    document.querySelectorAll('.links a, .support a').forEach(button => {
      button.addEventListener('click', function(e) {
        if (this.href === '#') e.preventDefault();
        
        const ripple = document.createElement('span');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;

        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.add('ripple');

        this.appendChild(ripple);
        
        setTimeout(() => ripple.remove(), 600);
      });
    });
  </script>

  <style>
    /* Ripple effect for buttons */
    .links a, .support a {
      position: relative;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(212, 175, 106, 0.6);
      transform: scale(0);
      animation: rippleEffect 0.6s ease-out;
      pointer-events: none;
    }

    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
</body>
</html>
